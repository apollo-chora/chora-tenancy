# skaffold.yaml — Cloud Deploy rendering config for chora-tenancy.
#
# Used by Cloud Deploy delivery-pipeline `chora-tenancy-pipeline` at the
# "render" stage. Image substitution happens automatically: the build step
# emits the image:tag, Cloud Deploy injects it into the manifests at deploy
# time via the `images` field.
#
# Per-target profiles select the namespace overlay:
#   dev  → services/chora-tenancy/clouddeploy/dev/ (namespace: tenancy-dev)
#   prod → services/chora-tenancy/clouddeploy/prod/ (namespace: tenancy)
#
# Top-level `verify` block — per chora-notifications pilot (2026-05-24)
# skaffold v4beta11 does NOT honour profile-level `verify` (silent
# `verifyJob.state=DISABLED`). Short hostname so the verify Job resolves
# in both dev (tenancy-dev) and prod (tenancy) namespaces.
#
# Canonical smoke: `grpc.health.v1.Health/Check` on port :9090 (Wave-1.5
# gRPC mass remediation 2026-05-16). chora-tenancy main.go:489-494
# registers Health for default + FamiliarEgg + Tenancy surfaces.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: chora-tenancy

verify:
  - name: grpc-health-smoke
    timeout: 120
    container:
      name: grpc-health-smoke
      image: fullstorydev/grpcurl:v1.8.9-alpine
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          ADDR="chora-tenancy:9090"
          echo "VERIFY: grpcurl -plaintext $ADDR grpc.health.v1.Health/Check"
          grpcurl -plaintext -connect-timeout 10 -max-time 30 "$ADDR" grpc.health.v1.Health/Check
    executionMode:
      kubernetesCluster: {}

profiles:
  - name: prod
    manifests:
      kustomize:
        paths:
          - prod
    deploy:
      kubectl:
        defaultNamespace: tenancy
      statusCheckDeadlineSeconds: 1800
