# Cloud Deploy PROD overlay for chora-tenancy.
# Inherits from chora-infra/k8s/services/chora-tenancy/ (base manifests).
# Namespace stays as `tenancy` (the existing prod namespace). Future
# prod-only hardening (PodDisruptionBudget, stricter resource limits,
# NetworkPolicy) lands as patches in this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tenancy

resources:
  - ../../../../chora-infra/k8s/services/chora-tenancy

labels:
  - includeSelectors: false
    pairs:
      chora.dev/env: prod

# Image override is applied by Cloud Deploy at release time via the
# `images:` field in `gcloud deploy releases create --images=...`.
