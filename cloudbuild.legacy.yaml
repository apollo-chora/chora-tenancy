# cloudbuild-service.yaml — canonical template for Chora Go service builds.
#
# Per-service `services/<svc>/cloudbuild.yaml` files copy this template and
# set `_SERVICE` + `_NAMESPACE` defaults; everything else stays identical so
# refreshes can be applied via sed.
#
# Aligned with:
#   .claude/skills/infra-gcp-compute/SKILL.md  (Artifact Registry conventions)
#   .claude/skills/secrets-and-env/SKILL.md    (no inline config — env-driven)
#   chora-infra/CLAUDE.md §3                   (security + sovereignty + no inline)
#   chora-infra/templates/Dockerfile.go-service (build context = repo root)
#
# Triggered by `google_cloudbuild_trigger` resources in
#   chora-infra/terraform/modules/m10-platform-services/cicd.tf:
#     - chora-<svc>-main-<env>   (push to main → build + push + deploy)
#     - chora-<svc>-release-<env> (tag pattern release-<svc>-* → release build)
#
# Phases:
#   1. docker buildx build (linux/amd64, distroless runtime)
#   2. push to AR with :<COMMIT_SHA> + :latest tags
#   3. kubectl set image + rollout status against chora-prod-cluster
#
# Runtime SA: chora-cicd-svc@chora-489812.iam.gserviceaccount.com
# (set on the trigger; needs roles/artifactregistry.writer +
#  roles/container.developer + roles/logging.logWriter — all granted by
#  chora-infra/terraform/modules/m10-projects/main.tf).

substitutions:
  _SERVICE: chora-tenancy             # override per-service
  _NAMESPACE: tenancy                 # override per-service (k8s namespace)
  _AR_DOCKER_REPO: chora-services
  _REGION: asia-southeast1
  _PLATFORM_PROJECT: chora-489812
  _GKE_CLUSTER: chora-prod-cluster
  _GKE_LOCATION: asia-southeast1

steps:
  # ── 1. Build + push image ────────────────────────────────────────────────
  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${_PLATFORM_PROJECT}/${_AR_DOCKER_REPO}/${_SERVICE}"
        BUILD_TIME=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
        # Ensure buildx is set up (idempotent)
        docker buildx create --use --name chora-builder >/dev/null 2>&1 || true
        docker buildx build \
          --platform=linux/amd64 \
          -f services/${_SERVICE}/Dockerfile \
          --build-arg SERVICE_NAME=${_SERVICE} \
          --build-arg GIT_SHA=${SHORT_SHA} \
          --build-arg BUILD_TIME=$${BUILD_TIME} \
          -t "$${IMAGE}:${SHORT_SHA}" \
          --push \
          .

  # ── 2. Deploy to GKE chora-prod-cluster ──────────────────────────────────
  - id: deploy-to-gke
    name: gcr.io/cloud-builders/kubectl
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${_PLATFORM_PROJECT}/${_AR_DOCKER_REPO}/${_SERVICE}:${SHORT_SHA}"
        gcloud container clusters get-credentials ${_GKE_CLUSTER} \
          --location=${_GKE_LOCATION} \
          --project=${_PLATFORM_PROJECT}
        kubectl -n ${_NAMESPACE} set image \
          deployment/${_SERVICE} \
          service=$${IMAGE}
        kubectl -n ${_NAMESPACE} rollout status \
          deployment/${_SERVICE} --timeout=5m
    waitFor:
      - build-and-push

# ── Build options ────────────────────────────────────────────────────────────
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

# 30-min ceiling; Go services typically build + deploy in 4-8 min.
timeout: "1800s"

tags:
  - chora
  - service-${_SERVICE}
  - env-${_ENVIRONMENT}
