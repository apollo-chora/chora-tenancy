    compliance: { gdpr: true, pdpa: true, ccpa: false, imda: true }
    ratings: { average: 4.4, count: 3 }

  - code: marketplace
    display_name: "Marketplace Add-Ons"
    short_pitch: "Per-user A+ marketplace SKUs"
    long_description: |
      Enables the per-user A+ marketplace where individual learners can
      purchase per-seat SKUs (Familiar Premium, Exam-Prep Coach, Reward
