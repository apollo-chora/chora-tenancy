    category: Engagement
    compliance: { gdpr: true, pdpa: true, ccpa: false, imda: true }
    ratings: { average: 4.9, count: 21 }

  - code: campus-ops
    display_name: "Campus Operations"
    short_pitch: "Multi-site campus admin"
